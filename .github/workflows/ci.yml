name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure media tooling
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run unit and media smoke tests
        run: npm test
      - name: Check environment
        run: node bin/avp.mjs doctor

  remotion-scene-edit:
    name: Render and QA an edited scene with Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install FFmpeg and Remotion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --no-audit --no-fund
      - name: Install Remotion Headless Shell
        run: npx remotion browser ensure
      - name: Render actual edited preview and run media QA
        env:
          AVP_REMOTION_SMOKE: '1'
        run: node --test tests/remotion-edit-smoke.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Capture real browser actions, verify network/DOM evidence and run QA
        env:
          AVP_BROWSER_SMOKE: '1'
        run: node --test tests/browser-evidence-smoke.test.mjs tests/default-project-browser-smoke.test.mjs tests/adapter-browser-smoke.test.mjs
