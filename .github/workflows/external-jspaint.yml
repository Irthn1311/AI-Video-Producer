name: External JS Paint pilot
on:
  push:
    branches: ['test/external-jspaint-pilot', 'test/external-quality-voice']
  pull_request:
    paths:
      - 'benchmarks/external-jspaint.mjs'
      - '.github/workflows/external-jspaint.yml'
      - 'src/capture-actions.mjs'
      - 'src/capture-assertions.mjs'
      - 'src/pointer-actions.mjs'
      - 'src/adapters.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, quality]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned public source without running upstream code
        uses: actions/checkout@v4
        with:
          repository: 1j01/jspaint
          ref: 53be67ab8c47cc0d2168899e7481bc04839c4c81
          path: external-jspaint
          persist-credentials: false
      - name: Install AVP-owned runtime tooling only
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg iproute2 util-linux espeak-ng fonts-noto-core
          npm install --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/avp-browsers" npx playwright install chromium --with-deps
      - name: Run unprivileged pilot in a fresh network namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/avp-pilot-home" "$RUNNER_TEMP/avp-pilot-result"
          # Loopback only; no host networking or inherited secrets. The upstream
          # JavaScript runs only in Chromium, never as Node/npm scripts.
          sudo unshare --net --fork bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=1 PLAYWRIGHT_BROWSERS_PATH="$4" AVP_EXTERNAL_ISOLATED=1 "$5" "$6" "$7" "$8" "$9"
          ' _ "$(id -un)" "$PATH" "$RUNNER_TEMP/avp-pilot-home" "$RUNNER_TEMP/avp-browsers" "$(command -v node)" "$GITHUB_WORKSPACE/benchmarks/external-jspaint.mjs" "$GITHUB_WORKSPACE/external-jspaint" "$RUNNER_TEMP/avp-pilot-result" "${{ matrix.mode }}"
      - name: Retain public synthetic-data pilot videos and technical report
        uses: actions/upload-artifact@v4
        with:
          name: jspaint-avp-pilot-${{ matrix.mode }}
          path: ${{ runner.temp }}/avp-pilot-result/
          retention-days: 7
